name: Compile Custom HyperHEN Payload
on: [push, workflow_dispatch]

jobs:
  build-payload:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Main Repository Base
        uses: actions/checkout@v4

      - name: Generate Local Gitmodules Mapping
        run: |
          # Programmatically build the missing submodule map definition file inside the runner workspace
          cat << 'EOF' > .gitmodules
          [submodule "third_party/kstuff-a53"]
              path = third_party/kstuff-a53
              url = https://github.com
          EOF
          
          # Initialize, sync, and sync the project tree mappings
          git submodule init
          git submodule sync
          git submodule update --init --recursive --depth 1

      - name: Inject Clean 13.60 Pure Assembly Hack
        run: |
          # Append our clean assembly patch routine safely to the bottom of the bootstrapper's main file
          cat << 'EOF' >> source/bootstrapper/main.c

          void __attribute__((constructor)) load_1360_fpkg_fix(void) {
              uint64_t target_kbase = 0;
              if (ps5_kernel_get_base(&target_kbase) == 0 && target_kbase != 0) {
                  uint64_t final_patch_addr = target_kbase + 0x001e0e0a7;
                  __asm__ volatile(
                      "mov %%cr0, %%rax\n"
                      "mov %%rax, %%rdx\n"
                      "and $0xfffffffffffeffff, %%rax\n"
                      "mov %%rax, %%cr0\n"
                      "movb $0x31, (%0)\n"
                      "movb $0xC0, 1(%0)\n"
                      "movb $0xC3, 2(%0)\n"
                      "mov %%rdx, %%cr0\n"
                      :
                      : "r"(final_patch_addr)
                      : "rax", "rdx", "memory"
                  );
              }
          }
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Payload Container Graph
        run: docker compose build hyperhen-build

      - name: Compile Final ELF Binary
        run: docker compose run --rm hyperhen-build

      - name: Upload Finished Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Custom-HyperHEN-13.60
          path: build/bin/HyperHEN.elf
