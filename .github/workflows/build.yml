name: Compile Custom HyperHEN Payload
on: [push, workflow_dispatch]

jobs:
  build-payload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main Repository Base
        uses: actions/checkout@v4

      - name: Manually Inject Submodule Architecture
        run: |
          mkdir -p third_party/kstuff-a53
          curl -L https://github.com -o kstuff.zip
          unzip kstuff.zip
          mv kstuff-a53-main/* third_party/kstuff-a53/
          rm -rf kstuff.zip kstuff-a53-main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Payload Container Graph
        run: docker compose build hyperhen-build

      - name: Compile Final ELF Binary
        run: docker compose run --rm hyperhen-build

      - name: Upload Finished Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Custom-HyperHEN-13.60
          path: build/bin/HyperHEN.elf
