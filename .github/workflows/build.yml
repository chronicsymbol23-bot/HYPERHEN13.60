name: Compile Custom HyperHEN Payload
on: [push, workflow_dispatch]

jobs:
  build-payload:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Main Repository Base
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Inject Automated 13.60 Core Patch
        run: |
          # Inject the absolute patch sequence directly into the bootstrapper logic
          sed -i '/void main_payload_init/a \    uint64_t target_kbase = 0;\n    if (ps5_kernel_get_base(&target_kbase) == 0 && target_kbase != 0) {\n        uint64_t final_patch_offset = target_kbase + 0x001e0e0a7;\n        uint64_t current_cr0 = __readcr0();\n        __writecr0(current_cr0 & ~0x10000);\n        *(volatile uint8_t *)(final_patch_offset + 0) = 0x31;\n        *(volatile uint8_t *)(final_patch_offset + 1) = 0xC0;\n        *(volatile uint8_t *)(final_patch_offset + 2) = 0xC3;\n        __writecr0(current_cr0);\n    }' source/bootstrapper/main.c

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Payload Container Graph
        run: docker compose build hyperhen-build

      - name: Compile Final ELF Binary
        run: docker compose run --rm hyperhen-build

      - name: Upload Finished Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Custom-HyperHEN-13.60
          path: build/bin/HyperHEN.elf
